[project]
name = "virtual-hr-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vaithees-R", email = "vaithees.r12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "google-genai==2.21.0",
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "pypdf2==3.0.1",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "python-dotenv==1.2.3",
    "sentence-transformers==6.0.1",
]

[project.scripts]
virtual-hr-bot = "virtual_hr_bot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
